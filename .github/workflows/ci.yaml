name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  INVENTREE_SITE_URL: http://localhost:8000
  INVENTREE_DB_ENGINE: django.db.backends.sqlite3
  INVENTREE_DB_NAME: ../klerk_unit_test_db.sqlite3
  INVENTREE_MEDIA_ROOT: ../test_klerk_media
  INVENTREE_STATIC_ROOT: ../test_klerk_static
  INVENTREE_BACKUP_DIR: ../test_klerk_backup
  INVENTREE_ADMIN_USER: admin
  INVENTREE_ADMIN_PASSWORD: ikipaswod
  INVENTREE_ADMIN_EMAIL: ulangrus@coba.com
jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Flutter and FVM
        id: fvm-config-action
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Collect Translation Files
        run: |
          cd lib/l10n
          python collect_translations.py

      - name: Static Analysis Tests
        working-directory: .
        run: |
          python ./find_dart_files.py
          dart pub global activate fvm
          fvm install
          fvm flutter pub get
          fvm flutter analyze
          dart format --output=none --set-exit-if-changed .

      - name: Start Klerk Server
        run: |
          sudo apt-get install python3-dev python3-pip python3-venv python3-wheel g++
          pip3 install invoke
          git clone --depth 1 https://github.com/StonedDawg/InvenTree ./klerk_server
          cd klerk_server
          invoke install
          invoke migrate
          invoke dev.import-fixtures
          invoke dev.server -a 127.0.0.1:8000 &
          invoke wait
          sleep 30

      - name: Unit Tests
        run: |
          fvm flutter test --coverage

      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
